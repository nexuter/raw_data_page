<style>
  :root {

    --ink-soft: #4a4045;
    --muted: #6f6367;
    --rule: #e4dde0;
    --rule-soft: #efeaec;
    --scarlet: #cc0033;
    --scarlet-ink: #a30029;
    --scarlet-wash: #fdeff2;
    --chip: #f3eff0;
    --focus: #cc0033;

    --sans: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #161315;
      --surface: #1f1a1d;
      --ink: #f0eaec;
      --ink-soft: #cbc1c5;
      --muted: #a69ba0;
      --rule: #332c30;
      --rule-soft: #262023;
      --scarlet: #ff5c7a;
      --scarlet-ink: #ff879c;
      --scarlet-wash: #2e1a20;
      --chip: #272125;
      --focus: #ff5c7a;
    }
  }

  :root[data-theme="dark"] {
    --ground: #161315;
    --surface: #1f1a1d;
    --ink: #f0eaec;
    --ink-soft: #cbc1c5;
    --muted: #a69ba0;
    --rule: #332c30;
    --rule-soft: #262023;
    --scarlet: #ff5c7a;
    --scarlet-ink: #ff879c;
    --scarlet-wash: #2e1a20;
    --chip: #272125;
    --focus: #ff5c7a;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15.5px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--scarlet-ink); }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 2px;
  }

  .shell {
    max-width: 1060px;
    margin: 0 auto;
    padding: 0 28px 120px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    padding: 56px 0 26px;
    border-bottom: 1px solid var(--rule);
  }

  h1 {
    font-size: clamp(32px, 5vw, 44px);
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.025em;
    margin: 0;
    text-wrap: balance;
  }

  /* ---------- controls ---------- */

  .controls {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--ground);
    border-bottom: 1px solid var(--rule);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 18px;
    padding: 14px 0;
  }

  .search {
    position: relative;
    flex: 1 1 280px;
    display: flex;
    align-items: center;
    max-width: 460px;
  }

  .search input {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 9px 40px 9px 12px;
  }

  .search input::placeholder { color: var(--muted); }

  .search input:focus {
    border-color: var(--scarlet);
    outline: none;
  }

  .slash-hint {
    position: absolute;
    right: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 1px 6px;
    pointer-events: none;
  }

  .result-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin: 0 0 0 auto;
  }

  /* ---------- body grid ---------- */

  .stacks {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr);
    gap: 0 30px;
    align-items: start;
  }

  .rail {
    position: sticky;
    top: 78px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding-top: 42px;
  }

  .rail a,
  .rail span {
    font-family: var(--mono);
    font-size: 11px;
    text-align: center;
    padding: 2px 0;
    border-radius: 2px;
    text-decoration: none;
  }

  .rail a { color: var(--ink-soft); }

  .rail a:hover {
    color: var(--scarlet-ink);
    background: var(--scarlet-wash);
  }

  .rail span { color: var(--rule); }

  /* ---------- groups + entries ---------- */

  .group { scroll-margin-top: 84px; }

  .group-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 32px 0 8px;
  }

  .group-head h2 {
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--scarlet);
  }

  .group-head hr {
    flex: 1;
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 0;
  }

  .group-head .n {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .entry {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 168px;
    gap: 4px 28px;
    padding: 18px 0;
    border-top: 1px solid var(--rule-soft);
  }

  .entry:first-of-type { border-top: 0; }

  .entry-name {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -0.011em;
    margin: 0;
  }

  .entry-name a {
    color: var(--ink);
    text-decoration: none;
    background-image: linear-gradient(var(--scarlet), var(--scarlet));
    background-size: 100% 1px;
    background-position: 0 100%;
    background-repeat: no-repeat;
  }

  .entry-name a:hover { color: var(--scarlet-ink); }

  .entry-name .unlinked { color: var(--ink-soft); }

  .entry-summary {
    grid-column: 1;
    margin: 4px 0 0;
    color: var(--ink-soft);
    max-width: 64ch;
  }

  .entry-meta {
    grid-column: 2;
    grid-row: 1 / span 2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 7px;
    padding-top: 2px;
  }

  .access {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 3px;
    color: var(--scarlet-ink);
    background: var(--scarlet-wash);
    white-space: nowrap;
  }

  .contact {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.4;
    margin: 0;
  }

  .contact a { color: var(--muted); text-decoration-color: var(--rule); }
  .contact a:hover { color: var(--scarlet-ink); }
  .contact .who { display: block; color: var(--ink-soft); }

  .empty {
    padding: 60px 0;
    font-size: 17px;
    color: var(--muted);
  }

  footer {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  @media (max-width: 720px) {
    .shell { padding: 0 18px 80px; }
    .stacks { grid-template-columns: minmax(0, 1fr); }
    .rail { display: none; }
    .entry { grid-template-columns: minmax(0, 1fr); }
    .entry-meta {
      grid-column: 1;
      grid-row: auto;
      flex-direction: row;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 12px;
      padding-top: 8px;
    }
    .contact .who { display: inline; }
  }

  html { scroll-behavior: smooth; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>

  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  const listEl = document.getElementById("list");
  const railEl = document.getElementById("rail");
  const countEl = document.getElementById("count");
  const queryEl = document.getElementById("q");

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  function entryHTML(d) {
    const title = d.url
      ? '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.name) + "</a>"
      : '<span class="unlinked">' + esc(d.name) + "</span>";
    const who = d.contactUrl
      ? '<a href="' + esc(d.contactUrl) + '" target="_blank" rel="noopener">' + esc(d.contact) + "</a>"
      : esc(d.contact);
    const tag = d.byRequest ? '<span class="access">By request</span>' : "";
    const contact = d.contact ? '<p class="contact">Ask <span class="who">' + who + "</span></p>" : "";
    const meta = tag || contact ? '<div class="entry-meta">' + tag + contact + "</div>" : "";
    return '<article class="entry">' +
      '<h3 class="entry-name">' + title + "</h3>" +
      '<p class="entry-summary">' + esc(d.summary) + "</p>" +
      meta +
    "</article>";
  }

  function render() {
    const q = queryEl.value.trim().toLowerCase();
    const hits = DB.filter(d =>
      !q || (d.name + " " + d.summary + " " + d.contact).toLowerCase().includes(q)
    );

    const groups = new Map();
    for (const d of hits) {
      if (!groups.has(d.letter)) groups.set(d.letter, []);
      groups.get(d.letter).push(d);
    }

    listEl.innerHTML = hits.length
      ? [...groups].map(pair =>
          '<section class="group" id="letter-' + pair[0] + '">' +
            '<div class="group-head"><h2>' + pair[0] + "</h2><hr>" +
            '<span class="n">' + pair[1].length + "</span></div>" +
            pair[1].map(entryHTML).join("") +
          "</section>"
        ).join("")
      : '<p class="empty">No database matches that search.</p>';

    railEl.innerHTML = LETTERS.map(l =>
      groups.has(l)
        ? '<a href="#letter-' + l + '">' + l + "</a>"
        : '<span aria-hidden="true">' + l + "</span>"
    ).join("");

    countEl.textContent = hits.length + " of " + DB.length;
  }

  queryEl.addEventListener("input", render);

  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== queryEl) {
      e.preventDefault();
      queryEl.focus();
    }
  });

  render();
</script>
